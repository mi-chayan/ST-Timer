<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#215da5">
<meta name="description" content="Snow Timer — Snowtex continuous and start/stop cycle timing with Normal and Standard time calculation.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Snow Timer">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Snow Timer</title>
<style>
:root{--bg:#000;--panel:#0c1214;--panel2:#0f1b22;--line:#1d2a2e;--text:#e8f1f2;--dim:#7d9296;--green:#39ff88;--cyan:#22d3ee;--red:#ff5a5f;--amber:#f5b83d;--brand:#215da5;--brand2:#3a7fd0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
body{background:radial-gradient(1200px 600px at 50% -10%,rgba(33,93,165,.25),transparent 60%),var(--bg)}
.app{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh;padding:env(safe-area-inset-top,0px) 10px calc(env(safe-area-inset-bottom,0px) + 10px);max-width:560px;margin:0 auto;gap:8px;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;animation:appIn .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes appIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.brand{display:flex;align-items:center;justify-content:center;gap:7px;margin-top:4px}
.brand .dot{width:7px;height:7px;border-radius:50%;background:linear-gradient(135deg,var(--brand2),var(--brand));box-shadow:0 0 10px rgba(58,127,208,.8)}
.brand b{font-size:12px;letter-spacing:.16em;color:var(--brand2);font-weight:800}
.row{display:flex;gap:8px}
.seg{position:relative;display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:2px;background:var(--panel)}
.seg-thumb{position:absolute;top:3px;left:3px;width:calc(50% - 5px);height:calc(100% - 6px);background:linear-gradient(135deg,var(--cyan),#0ea5c4);border-radius:9px;transition:transform .28s cubic-bezier(.4,0,.2,1);z-index:0;box-shadow:0 2px 10px rgba(34,211,238,.35)}
.seg button{position:relative;z-index:1;flex:1;background:transparent;color:var(--dim);border:0;padding:12px 8px;font-size:14px;font-weight:700;min-height:44px;transition:color .2s,opacity .15s}
.seg button.on{color:#001418}
.seg button:disabled{opacity:.4}
.field{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 10px;transition:border-color .15s,box-shadow .15s}
.field:focus-within{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(34,211,238,.15)}
.field label{display:block;font-size:11px;color:var(--dim);font-weight:600;letter-spacing:.02em}
.field input{width:100%;background:none;border:0;color:var(--cyan);font-size:20px;font-weight:700;padding:4px 0;outline:none}
.display{position:relative;background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:18px;padding:16px 12px 14px;text-align:center;overflow:hidden;transition:box-shadow .3s}
.display.live{box-shadow:0 0 0 1px rgba(255,90,95,.3),0 0 30px rgba(255,90,95,.18);animation:breathe 2.2s ease-in-out infinite}
@keyframes breathe{0%,100%{box-shadow:0 0 0 1px rgba(255,90,95,.3),0 0 22px rgba(255,90,95,.14)}50%{box-shadow:0 0 0 1px rgba(255,90,95,.45),0 0 38px rgba(255,90,95,.28)}}
.status{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--dim);font-weight:700;letter-spacing:.06em}
.status .led{width:7px;height:7px;border-radius:50%;background:var(--dim)}
.display.live .status{color:var(--red)}
.display.live .status .led{background:var(--red);box-shadow:0 0 8px rgba(255,90,95,.9);animation:blink 1s steps(2,jump-none) infinite}
@keyframes blink{50%{opacity:.25}}
.track{height:3px;border-radius:2px;background:var(--line);margin:8px auto 2px;width:70%;overflow:hidden;opacity:0}
.display.live .track{opacity:1}
.track i{display:block;height:100%;width:38%;border-radius:2px;background:linear-gradient(90deg,transparent,var(--red),transparent);animation:slide 1.3s linear infinite}
@keyframes slide{from{transform:translateX(-120%)}to{transform:translateX(360%)}}
#cur{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-variant-numeric:tabular-nums;font-size:clamp(52px,17vw,88px);font-weight:700;color:var(--green);line-height:1.05;text-shadow:0 0 22px rgba(57,255,136,.3);margin:2px 0}
.display.live #cur{color:#fff}
.unit{color:var(--dim);font-size:12px}
.result{display:flex;gap:8px}
.result-card{flex:1;position:relative;overflow:hidden;background:linear-gradient(160deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:14px;padding:11px 8px;text-align:center}
.result-card::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 25% 15%,rgba(34,211,238,.1),transparent 55%);pointer-events:none}
.result-card span{display:block;font-size:10.5px;color:var(--dim);font-weight:600;letter-spacing:.02em}
.result-card span i{font-style:normal;opacity:.75}
.result-card b{display:block;font-size:25px;font-variant-numeric:tabular-nums;color:var(--text);margin-top:1px}
.result-card small{font-size:9.5px;color:var(--dim)}
.result-card.hi{border-color:rgba(34,211,238,.45)}
.result-card.hi b{color:var(--cyan)}
.bump{animation:bump .28s ease}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.14)}100%{transform:scale(1)}}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 4px;text-align:center}
.stat span{display:block;font-size:10.5px;color:var(--dim)}
.stat b{font-size:15px;font-variant-numeric:tabular-nums;display:inline-block}
.list{flex:1;min-height:76px;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;-webkit-overflow-scrolling:touch}
.item{display:flex;justify-content:space-between;align-items:center;padding:9px 6px 9px 14px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.item:last-child{border-bottom:0}
.item.new{animation:itemIn .32s cubic-bezier(.2,.8,.2,1) both}
@keyframes itemIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
.item i{font-style:normal;color:var(--dim);font-size:13px}
.item b{font-size:17px;margin-left:10px}
.item button{position:relative;overflow:hidden;background:none;border:0;color:var(--red);font-size:19px;padding:10px 14px;min-width:44px;min-height:44px;line-height:1;border-radius:8px}
.empty{padding:20px 12px;text-align:center;color:var(--dim);font-size:13px;line-height:1.5}
.ctl{display:flex;gap:8px}
.ctl button{position:relative;overflow:hidden;flex:1;height:80px;border:0;border-radius:16px;font-size:22px;font-weight:800;letter-spacing:.03em;color:#001418;transition:transform .08s,box-shadow .25s}
.ctl button:active{transform:scale(.97)}
#main{background:linear-gradient(135deg,#5dffa6,var(--green));box-shadow:0 6px 18px rgba(57,255,136,.25)}
#main.run{background:linear-gradient(135deg,#ff8a8e,var(--red));color:#fff;box-shadow:0 6px 20px rgba(255,90,95,.35);animation:ringPulse 1.6s ease-in-out infinite}
@keyframes ringPulse{0%,100%{box-shadow:0 6px 20px rgba(255,90,95,.3),0 0 0 0 rgba(255,90,95,.35)}50%{box-shadow:0 6px 20px rgba(255,90,95,.4),0 0 0 8px rgba(255,90,95,0)}}
#side{background:linear-gradient(135deg,#7fe9ff,var(--cyan));box-shadow:0 6px 18px rgba(34,211,238,.25)}
#side:disabled{background:var(--panel);color:var(--dim);border:1px solid var(--line);box-shadow:none}
.tools{display:flex;gap:8px}
.tools button{position:relative;overflow:hidden;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:var(--panel);border:1px solid var(--line);color:var(--dim);border-radius:12px;padding:9px 4px;font-size:10.5px;font-weight:600;min-height:52px;transition:opacity .15s,border-color .15s,color .15s}
.tools button svg{width:17px;height:17px}
.tools button:disabled{opacity:.35}
.tools button:not(:disabled):active{border-color:var(--cyan);color:var(--cyan)}
.ripple::after{content:'';position:absolute;left:var(--rx,50%);top:var(--ry,50%);width:10px;height:10px;background:rgba(255,255,255,.4);border-radius:50%;transform:translate(-50%,-50%) scale(0);opacity:1;animation:rip .55s ease-out;pointer-events:none}
@keyframes rip{to{transform:translate(-50%,-50%) scale(20);opacity:0}}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);transform:translate(-50%,16px);background:#141c1f;border:1px solid var(--line);color:var(--text);padding:10px 16px;border-radius:999px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .22s,transform .22s;box-shadow:0 8px 24px rgba(0,0,0,.4);z-index:50;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60;padding:20px}
.modal-backdrop.show{opacity:1;pointer-events:auto}
.modal{background:var(--panel2);border:1px solid var(--line);border-radius:16px;padding:20px;max-width:320px;width:100%;text-align:center;transform:scale(.92);transition:transform .22s cubic-bezier(.2,.8,.2,1)}
.modal-backdrop.show .modal{transform:scale(1)}
.modal p{margin:0 0 16px;font-size:15px;color:var(--text)}
.modal-actions{display:flex;gap:8px}
.modal-actions button{flex:1;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--text);font-size:14px;font-weight:700}
.modal-actions button.danger{background:var(--red);border-color:var(--red);color:#fff}
@media (max-width:360px){.stats{grid-template-columns:repeat(2,1fr)}}
@media (max-height:620px){#cur{font-size:clamp(42px,15vw,68px)}.ctl button{height:64px}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}
</style>
</head>
<body>
<div class="app">
  <div class="brand"><span class="dot"></span><b>SNOW TIMER</b></div>
  <div class="seg" id="modes">
    <div class="seg-thumb"></div>
    <button data-m="cont" class="on">Continuous</button>
    <button data-m="ss">Start / Stop</button>
  </div>
  <div class="row">
    <div class="field"><label for="rating">Rating %</label><input id="rating" type="number" inputmode="decimal" value="100"></div>
    <div class="field"><label for="allow">Allowance %</label><input id="allow" type="number" inputmode="decimal" value="15"></div>
  </div>
  <div class="display" id="display">
    <div class="status"><span class="led"></span><span id="curlabel">Current cycle</span></div>
    <div id="cur">0.00</div>
    <div class="unit">decimal minutes (100 = 1 min)</div>
    <div class="track"><i></i></div>
  </div>
  <div class="result">
    <div class="result-card"><span>Normal Time</span><b id="sNorm">0.00</b><small>min / cycle</small></div>
    <div class="result-card hi"><span>Standard Time <i>(SMV)</i></span><b id="sStd">0.00</b><small>min / cycle</small></div>
  </div>
  <div class="stats">
    <div class="stat"><span>Count</span><b id="sCount">0</b></div>
    <div class="stat"><span>Total</span><b id="sTotal">0.00</b></div>
    <div class="stat"><span>Average</span><b id="sAvg">0.00</b></div>
    <div class="stat"><span>Std dev</span><b id="sSd">0.00</b></div>
    <div class="stat"><span>Min</span><b id="sMin">0.00</b></div>
    <div class="stat"><span>Max</span><b id="sMax">0.00</b></div>
  </div>
  <div class="list" id="list"></div>
  <div class="tools">
    <button id="undo" aria-label="Undo last cycle">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v6h6"/><path d="M3.51 13a9 9 0 1 0 2.13-9.36L3 7"/></svg>
      <span>Undo</span>
    </button>
    <button id="clear" aria-label="Clear all cycles">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
      <span>Clear</span>
    </button>
    <button id="copy" aria-label="Copy CSV to clipboard">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
      <span>Copy CSV</span>
    </button>
  </div>
  <div class="ctl">
    <button id="main" aria-label="Start or stop timer">START</button>
    <button id="side" disabled aria-label="Record lap">LAP</button>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <p id="modalMsg">Delete all recorded cycles?</p>
    <div class="modal-actions">
      <button id="modalCancel">Cancel</button>
      <button id="modalConfirm" class="danger">Delete</button>
    </div>
  </div>
</div>
<script>
(function(){
  var mode='cont',running=false,start=0,times=[],raf=0,wl=null,lastAction=0,justAddedIdx=-1;
  var $=function(i){return document.getElementById(i)};
  var f=function(v){return v.toFixed(2)};
  var dm=function(ms){return ms/60000};
  function guard(){var now=Date.now();if(now-lastAction<120)return false;lastAction=now;return true}
  function setStat(id,val){var el=$(id);if(el.textContent!==val){el.textContent=val;el.classList.remove('bump');void el.offsetWidth;el.classList.add('bump')}}
  function toast(msg){var t=$('toast');t.textContent=msg;t.classList.remove('show');void t.offsetWidth;t.classList.add('show');clearTimeout(toast._tm);toast._tm=setTimeout(function(){t.classList.remove('show')},1600)}
  function confirmDialog(msg){
    return new Promise(function(resolve){
      $('modalMsg').textContent=msg;
      var bd=$('modalBackdrop');
      bd.classList.add('show');
      function cleanup(res){bd.classList.remove('show');$('modalConfirm').onclick=null;$('modalCancel').onclick=null;resolve(res)}
      $('modalConfirm').onclick=function(){cleanup(true)};
      $('modalCancel').onclick=function(){cleanup(false)};
    });
  }
  function save(){try{localStorage.setItem('iect',JSON.stringify({times:times,r:$('rating').value,a:$('allow').value,mode:mode}))}catch(e){}}
  function load(){try{var d=JSON.parse(localStorage.getItem('iect')||'null');if(d){times=d.times||[];if(d.r!=null)$('rating').value=d.r;if(d.a!=null)$('allow').value=d.a;mode=d.mode||'cont'}}catch(e){}}
  function tick(){$('cur').textContent=f(dm(performance.now()-start));raf=requestAnimationFrame(tick)}
  function keepAwake(on){
    try{
      if(on&&navigator.wakeLock){
        if(!wl)navigator.wakeLock.request('screen').then(function(l){wl=l;l.addEventListener('release',function(){wl=null})}).catch(function(){})
      }else if(!on&&wl){wl.release();wl=null}
    }catch(e){}
  }
  function render(){
    var addedIdx=justAddedIdx;justAddedIdx=-1;
    var n=times.length,sum=times.reduce(function(a,b){return a+b},0),avg=n?sum/n:0;
    var sd=0;if(n>1){sd=Math.sqrt(times.reduce(function(a,b){return a+(b-avg)*(b-avg)},0)/(n-1))}
    var r=parseFloat($('rating').value);if(isNaN(r))r=100;
    var a=parseFloat($('allow').value);if(isNaN(a))a=0;
    var norm=avg*r/100,std=norm*(1+a/100);
    setStat('sCount',String(n));setStat('sTotal',f(sum));setStat('sAvg',f(avg));setStat('sSd',f(sd));
    setStat('sMin',n?f(Math.min.apply(null,times)):'0.00');
    setStat('sMax',n?f(Math.max.apply(null,times)):'0.00');
    setStat('sNorm',f(norm));setStat('sStd',f(std));
    var l=$('list');
    if(!n){l.innerHTML='<div class="empty">No cycles yet.<br>Press START, then '+(mode==='cont'?'LAP at the end of each cycle.':'STOP at the end of each cycle.')+'</div>'}
    else{l.innerHTML=times.map(function(t,i){return '<div class="item'+(i===addedIdx?' new':'')+'"><i>Cycle '+(i+1)+'<b>'+f(t)+'</b></i><button data-i="'+i+'" aria-label="Delete cycle '+(i+1)+'">&times;</button></div>'}).reverse().join('')}
    var m=$('main'),s=$('side');
    document.querySelectorAll('#modes button').forEach(function(b){b.classList.toggle('on',b.dataset.m===mode);b.disabled=running});
    $('modes').querySelector('.seg-thumb').style.transform = mode==='ss' ? 'translateX(100%)' : 'translateX(0%)';
    if(mode==='cont'){m.textContent=running?'STOP':'START';s.style.display='';s.textContent='LAP';s.disabled=!running}
    else{m.textContent=running?'STOP':'START';s.style.display='none'}
    m.classList.toggle('run',running);
    $('display').classList.toggle('live',running);
    $('curlabel').textContent=running?'Timing':'Current cycle';
    $('undo').disabled=!n;$('clear').disabled=!n;$('copy').disabled=!n;
    save();
  }
  function begin(){running=true;start=performance.now();cancelAnimationFrame(raf);tick();keepAwake(true);render()}
  function lap(){var t=dm(performance.now()-start);if(t>0){times.push(t);justAddedIdx=times.length-1;start=performance.now()}if(navigator.vibrate)navigator.vibrate(30);render()}
  function stop(record){
    var t=dm(performance.now()-start);
    running=false;cancelAnimationFrame(raf);keepAwake(false);
    if(record&&t>0){times.push(t);justAddedIdx=times.length-1}
    $('cur').textContent=f(record?0:t);if(record&&navigator.vibrate)navigator.vibrate(30);
    render();
  }
  $('main').onclick=function(){
    if(!guard())return;
    if(!running){begin();return}
    stop(true);
  };
  $('side').onclick=function(){if(running&&guard())lap()};
  $('modes').onclick=function(e){var b=e.target.closest('button');if(!b||running||b.disabled)return;mode=b.dataset.m;render()};
  $('list').onclick=function(e){var b=e.target.closest('button');if(!b)return;times.splice(+b.dataset.i,1);render();toast('Cycle removed')};
  $('undo').onclick=function(){if(!times.length)return;times.pop();render();toast('Last cycle removed')};
  $('clear').onclick=function(){
    if(!times.length)return;
    confirmDialog('Delete all '+times.length+' recorded cycles?').then(function(ok){
      if(ok){times=[];if(!running)$('cur').textContent='0.00';render();toast('All cycles cleared')}
    });
  };
  $('copy').onclick=function(){
    if(!times.length)return;
    var csv='cycle,decimal_minutes\n'+times.map(function(t,i){return (i+1)+','+f(t)}).join('\n');
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(csv).then(function(){toast('Copied '+times.length+' cycles to clipboard')}).catch(function(){toast('Copy failed')})
    }
  };
  $('rating').oninput=render;$('allow').oninput=render;
  document.addEventListener('visibilitychange',function(){if(!document.hidden&&running)keepAwake(true)});
  document.addEventListener('pointerdown',function(e){
    var b=e.target.closest('.ctl button,.tools button,.seg button,.item button');
    if(!b||b.disabled)return;
    var r=b.getBoundingClientRect();
    b.style.setProperty('--rx',(e.clientX-r.left)+'px');
    b.style.setProperty('--ry',(e.clientY-r.top)+'px');
    b.classList.remove('ripple');void b.offsetWidth;b.classList.add('ripple');
  });
  if('serviceWorker' in navigator){
    window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});
  }
  load();render();
})();
</script>
</body>
</html>
