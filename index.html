<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="description" content="IE Cycle Timer — continuous and start/stop cycle timing with Normal and Standard time calculation.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cycle Timer">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>IE Cycle Timer</title>
<style>
:root{--bg:#000;--panel:#0c1214;--line:#1d2a2e;--text:#e8f1f2;--dim:#7d9296;--green:#39ff88;--cyan:#22d3ee;--red:#ff5a5f;--amber:#f5b83d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
body{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh;padding:env(safe-area-inset-top,0px) 10px calc(env(safe-area-inset-bottom,0px) + 10px);max-width:560px;margin:0 auto;gap:8px;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.title{text-align:center;font-size:11px;letter-spacing:.14em;color:var(--dim);font-weight:700;margin-top:4px}
.row{display:flex;gap:8px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:4px}
.seg button{flex:1;background:var(--panel);color:var(--dim);border:0;padding:12px 8px;font-size:14px;font-weight:600;min-height:44px;transition:background .15s,color .15s,opacity .15s}
.seg button.on{background:var(--cyan);color:#001418}
.seg button:disabled{opacity:.4}
.seg button:active:not(:disabled){filter:brightness(.85)}
.field{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 10px}
.field label{display:block;font-size:12px;color:var(--dim)}
.field input{width:100%;background:none;border:0;color:var(--cyan);font-size:20px;font-weight:700;padding:4px 0;outline:none}
.display{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 12px;text-align:center}
.display small{color:var(--dim);font-size:12px}
#cur{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-variant-numeric:tabular-nums;font-size:clamp(54px,18vw,92px);font-weight:700;color:var(--green);line-height:1.05;text-shadow:0 0 18px rgba(57,255,136,.25)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 4px;text-align:center}
.stat span{display:block;font-size:11px;color:var(--dim)}
.stat b{font-size:15px;font-variant-numeric:tabular-nums}
.stat.hi{border-color:var(--cyan)}
.stat.hi b{color:var(--cyan)}
.list{flex:1;min-height:80px;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;-webkit-overflow-scrolling:touch}
.item{display:flex;justify-content:space-between;align-items:center;padding:8px 6px 8px 14px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.item i{font-style:normal;color:var(--dim)}
.item b{font-size:18px}
.item button{background:none;border:0;color:var(--red);font-size:20px;padding:10px 14px;min-width:44px;min-height:44px;line-height:1}
.empty{padding:18px;text-align:center;color:var(--dim);font-size:14px}
.ctl{display:flex;gap:8px}
.ctl button{flex:1;height:84px;border:0;border-radius:14px;font-size:24px;font-weight:800;color:#001418;transition:transform .08s,background .15s}
.ctl button:active{transform:scale(.97)}
#main{background:var(--green)}
#main.run{background:var(--red);color:#fff}
#side{background:var(--cyan)}
#side:disabled{background:var(--panel);color:var(--dim);border:1px solid var(--line)}
.tools{display:flex;gap:8px}
.tools button{flex:1;background:none;border:1px solid var(--line);color:var(--dim);border-radius:10px;padding:11px 6px;font-size:14px;min-height:44px;transition:opacity .15s}
.tools button:active:not(:disabled){filter:brightness(.8)}
.tools button:disabled{opacity:.35}
@media (max-width:360px){.stats{grid-template-columns:repeat(2,1fr)}}
@media (max-height:620px){#cur{font-size:clamp(44px,16vw,72px)}.ctl button{height:68px}}
</style>
</head>
<body>
<div class="title">IE CYCLE TIMER</div>
<div class="seg" id="modes">
  <button data-m="cont" class="on">Continuous</button>
  <button data-m="ss">Start / Stop</button>
</div>
<div class="row">
  <div class="field"><label for="rating">Rating %</label><input id="rating" type="number" inputmode="decimal" value="100"></div>
  <div class="field"><label for="allow">Allowance %</label><input id="allow" type="number" inputmode="decimal" value="15"></div>
</div>
<div class="display">
  <small id="curlabel">Current cycle</small>
  <div id="cur">0.00</div>
  <small>decimal minutes (100 = 1 min)</small>
</div>
<div class="stats">
  <div class="stat"><span>Count</span><b id="sCount">0</b></div>
  <div class="stat"><span>Total</span><b id="sTotal">0.00</b></div>
  <div class="stat"><span>Average</span><b id="sAvg">0.00</b></div>
  <div class="stat"><span>Std dev</span><b id="sSd">0.00</b></div>
  <div class="stat"><span>Min</span><b id="sMin">0.00</b></div>
  <div class="stat"><span>Max</span><b id="sMax">0.00</b></div>
  <div class="stat hi"><span>Normal</span><b id="sNorm">0.00</b></div>
  <div class="stat hi"><span>Standard</span><b id="sStd">0.00</b></div>
</div>
<div class="list" id="list"></div>
<div class="tools">
  <button id="undo" aria-label="Undo last cycle">Undo last</button>
  <button id="clear" aria-label="Clear all cycles">Clear all</button>
  <button id="copy" aria-label="Copy CSV to clipboard">Copy CSV</button>
</div>
<div class="ctl">
  <button id="main" aria-label="Start or stop timer">START</button>
  <button id="side" disabled aria-label="Record lap">LAP</button>
</div>
<script>
(function(){
  var mode='cont',running=false,start=0,times=[],raf=0,wl=null,lastAction=0;
  var $=function(i){return document.getElementById(i)};
  var f=function(v){return v.toFixed(2)};
  var dm=function(ms){return ms/60000};
  function guard(){var now=Date.now();if(now-lastAction<120)return false;lastAction=now;return true}
  function save(){try{localStorage.setItem('iect',JSON.stringify({times:times,r:$('rating').value,a:$('allow').value,mode:mode}))}catch(e){}}
  function load(){try{var d=JSON.parse(localStorage.getItem('iect')||'null');if(d){times=d.times||[];if(d.r!=null)$('rating').value=d.r;if(d.a!=null)$('allow').value=d.a;mode=d.mode||'cont'}}catch(e){}}
  function tick(){$('cur').textContent=f(dm(performance.now()-start));raf=requestAnimationFrame(tick)}
  function keepAwake(on){
    try{
      if(on&&navigator.wakeLock){
        if(!wl)navigator.wakeLock.request('screen').then(function(l){wl=l;l.addEventListener('release',function(){wl=null})}).catch(function(){})
      }else if(!on&&wl){wl.release();wl=null}
    }catch(e){}
  }
  function render(){
    var n=times.length,sum=times.reduce(function(a,b){return a+b},0),avg=n?sum/n:0;
    var sd=0;if(n>1){sd=Math.sqrt(times.reduce(function(a,b){return a+(b-avg)*(b-avg)},0)/(n-1))}
    var r=parseFloat($('rating').value);if(isNaN(r))r=100;
    var a=parseFloat($('allow').value);if(isNaN(a))a=0;
    var norm=avg*r/100,std=norm*(1+a/100);
    $('sCount').textContent=n;$('sTotal').textContent=f(sum);$('sAvg').textContent=f(avg);$('sSd').textContent=f(sd);
    $('sMin').textContent=n?f(Math.min.apply(null,times)):'0.00';
    $('sMax').textContent=n?f(Math.max.apply(null,times)):'0.00';
    $('sNorm').textContent=f(norm);$('sStd').textContent=f(std);
    var l=$('list');
    if(!n){l.innerHTML='<div class="empty">No cycles yet. Press START, then '+(mode==='cont'?'LAP at the end of each cycle.':'STOP at the end of each cycle.')+'</div>'}
    else{l.innerHTML=times.map(function(t,i){return '<div class="item"><i>Cycle '+(i+1)+'</i><b>'+f(t)+'</b><button data-i="'+i+'" aria-label="Delete cycle '+(i+1)+'">&times;</button></div>'}).reverse().join('')}
    var m=$('main'),s=$('side');
    document.querySelectorAll('#modes button').forEach(function(b){b.classList.toggle('on',b.dataset.m===mode);b.disabled=running});
    if(mode==='cont'){m.textContent=running?'STOP':'START';s.style.display='';s.textContent='LAP';s.disabled=!running}
    else{m.textContent=running?'STOP':'START';s.style.display='none'}
    m.classList.toggle('run',running);
    $('curlabel').textContent=running?'Timing…':'Current cycle';
    $('undo').disabled=!n;$('clear').disabled=!n;$('copy').disabled=!n;
    save();
  }
  function begin(){running=true;start=performance.now();cancelAnimationFrame(raf);tick();keepAwake(true);render()}
  function lap(){var t=dm(performance.now()-start);if(t>0){times.push(t);start=performance.now()}if(navigator.vibrate)navigator.vibrate(30);render()}
  function stop(record){
    var t=dm(performance.now()-start);
    running=false;cancelAnimationFrame(raf);keepAwake(false);
    if(record&&t>0)times.push(t);
    $('cur').textContent=f(record?0:t);if(record&&navigator.vibrate)navigator.vibrate(30);
    render();
  }
  $('main').onclick=function(){
    if(!guard())return;
    if(!running){begin();return}
    stop(true);
  };
  $('side').onclick=function(){if(running&&guard())lap()};
  $('modes').onclick=function(e){var b=e.target.closest('button');if(!b||running||b.disabled)return;mode=b.dataset.m;render()};
  $('list').onclick=function(e){var b=e.target.closest('button');if(!b)return;times.splice(+b.dataset.i,1);render()};
  $('undo').onclick=function(){if(!times.length)return;times.pop();render()};
  $('clear').onclick=function(){if(!times.length)return;if(confirm('Delete all recorded cycles?')){times=[];if(!running)$('cur').textContent='0.00';render()}};
  $('copy').onclick=function(){
    if(!times.length)return;
    var csv='cycle,decimal_minutes\n'+times.map(function(t,i){return (i+1)+','+f(t)}).join('\n');
    var done=function(){$('copy').textContent='Copied';setTimeout(function(){$('copy').textContent='Copy CSV'},1200)};
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(csv).then(done).catch(function(){})}
  };
  $('rating').oninput=render;$('allow').oninput=render;
  document.addEventListener('visibilitychange',function(){if(!document.hidden&&running)keepAwake(true)});
  if('serviceWorker' in navigator){
    window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});
  }
  load();render();
})();
</script>
</body>
</html>
